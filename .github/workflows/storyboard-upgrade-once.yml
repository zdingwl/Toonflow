name: Storyboard recovery upgrade one-shot
on:
  push:
    branches:
      - agent/storyboard-recovery-20260922
    paths:
      - scripts/storyboard_integrate_once.payload
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - name: Apply audited source patches
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, lzma
          payload = Path('scripts/storyboard_integrate_once.payload').read_text(encoding='utf-8')
          code = lzma.decompress(base64.b64decode(payload))
          exec(compile(code, 'storyboard_integrate_once.py', 'exec'))
          PY
          rm -f scripts/storyboard_integrate_once.payload
          git diff --check
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify storyboard and Agent tests
        run: yarn test:agent
      - name: TypeScript validation
        run: yarn lint
      - name: Commit tested source to upgrade branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(storyboard): integrate authoritative progress and deterministic resume'
          git push origin HEAD:agent/storyboard-recovery-20260922
