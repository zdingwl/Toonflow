name: Storyboard direct rebuild one-shot validation
on:
  push:
    branches: [agent/deterministic-storyboard-rebuild-20260922]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'run guarded staged rebuild integration') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - name: Apply guarded socket and generation changes
        run: python3 scripts/apply-deterministic-storyboard-rebuild.py
      - name: Support Chinese scene-count numerals in explicit rebuild command
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/agents/productionAgent/storyboardRebuildDispatch.ts')
          text = p.read_text(encoding='utf-8')
          old = r'(?:全部|整集|所有|\d+场|全部\d+场)?'
          new = r'(?:全部|整集|所有|[一二三四五六七八九十百\d]+场|全部[一二三四五六七八九十百\d]+场)?'
          if text.count(old) != 1: raise RuntimeError('Rebuild intent anchor changed')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify TypeScript syntax in touched files
        run: |
          node - <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          for (const file of ['src/socket/routes/productionAgent.ts', 'src/agents/productionAgent/index.ts', 'src/agents/productionAgent/storyboardRebuildDispatch.ts', 'tests/storyboard-rebuild-dispatch.test.ts']) {
            const result = ts.transpileModule(fs.readFileSync(file, 'utf8'), { fileName: file, reportDiagnostics: true, compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.CommonJS } });
            const errors = result.diagnostics?.filter(d => d.category === ts.DiagnosticCategory.Error) ?? [];
            if (errors.length) { console.error(file, errors.map(d => ts.flattenDiagnosticMessageText(d.messageText, '\n'))); process.exitCode = 1; }
            else console.log('Syntax OK:', file);
          }
          NODE
      - name: Run isolated storyboard transaction and dispatch regressions
        run: timeout 240s yarn tsx --test tests/storyboard-table.test.ts tests/storyboard-rebuild.test.ts tests/storyboard-rebuild-dispatch.test.ts tests/storyboard-recovery.test.ts tests/storyboard-revision.test.ts
      - name: Inspect staged diff
        run: |
          git diff --check
          git diff --stat
      - name: Commit only validated source and tests; remove one-shot tooling
        run: |
          git rm scripts/apply-deterministic-storyboard-rebuild.py .github/workflows/storyboard-direct-rebuild-once.yml
          git add src/agents/productionAgent/storyboardRebuildDispatch.ts src/agents/productionAgent/index.ts src/socket/routes/productionAgent.ts tests/storyboard-rebuild-dispatch.test.ts
          git -c user.name='Toonflow CI' -c user.email='actions@users.noreply.github.com' commit -m 'fix(storyboard): dispatch authorized full rebuild directly and resume safely'
          git push origin HEAD:agent/deterministic-storyboard-rebuild-20260922
