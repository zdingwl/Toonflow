name: Storyboard recovery upgrade integration
on:
  push:
    branches: [agent/storyboard-recovery-20260922]
    paths:
      - scripts/apply_storyboard_upgrade.py
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
      - name: Apply readable source changes
        run: |
          python scripts/apply_storyboard_upgrade.py
          git diff --check
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Test Agent and storyboard contracts
        run: yarn test:agent
      - name: Validate TypeScript
        run: yarn lint
      - name: Commit tested code to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply_storyboard_upgrade.py scripts/storyboard_integrate_once.payload scripts/storyboard_integrate_tail.payload .github/workflows/storyboard-upgrade-once.yml
          git add -A
          git diff --cached --check
          git commit -m 'feat(storyboard): deterministic per-scene generation and durable progress'
          git push origin HEAD:agent/storyboard-recovery-20260922
